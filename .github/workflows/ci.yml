name: MySQL 8.0 CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify-database:
    name: Validar DDL, Seed, Queries, Procedure e Constraints
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: vetcare_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pvetcare_ci_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garantir cliente MySQL disponível
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y mysql-client
          fi
          mysql --version

      - name: Executar suíte de verificação em MySQL 8.0
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: vetcare_ci_password
        run: bash tests/verify_mysql.sh
